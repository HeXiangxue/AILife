<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - AI 生活优选</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <h2>AI 生活优选</h2>
  <div class="auth-tabs">
    <div class="tab active" data-tab="login">登录</div>
    <div class="tab" data-tab="register">注册</div>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="loginUsername" placeholder="请输入用户名" required>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPassword" placeholder="请输入密码" required>
    </div>
    <button type="submit" class="btn btn-block">登 录</button>
    <p class="tip">演示账号：admin / admin123（管理员）、user1 / user123（普通用户）</p>
  </form>

  <form id="registerForm" style="display:none">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="regUsername" placeholder="3-20 个字符" required>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="regPassword" placeholder="6-30 个字符" required>
    </div>
    <div class="form-group">
      <label>昵称</label>
      <input type="text" id="regNickname" placeholder="您的昵称" required>
    </div>
    <button type="submit" class="btn btn-block">注 册</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="js/common.js"></script>
<script>
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => (t.style.display = 'none'), 2500);
  }

  document.querySelectorAll('.auth-tabs .tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.auth-tabs .tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const isLogin = tab.dataset.tab === 'login';
      document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
      document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
    });
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const resp = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('loginUsername').value,
          password: document.getElementById('loginPassword').value,
        }),
      });
      const data = await resp.json();
      if (data.code !== 200) throw new Error(data.message || '登录失败');
      setAuth(data.data.token, data.data.user);
      location.href = 'chat.html';
    } catch (err) {
      toast(err.message);
    }
  });

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const resp = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('regUsername').value,
          password: document.getElementById('regPassword').value,
          nickname: document.getElementById('regNickname').value,
        }),
      });
      const data = await resp.json();
      if (data.code !== 200) throw new Error(data.message || '注册失败');
      setAuth(data.data.token, data.data.user);
      location.href = 'chat.html';
    } catch (err) {
      toast(err.message);
    }
  });
</script>
</body>
</html>
